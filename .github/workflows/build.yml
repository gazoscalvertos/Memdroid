name: Build and release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build release APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk memdroid-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: memdroid-apk
          path: memdroid-*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Memdroid 1.0.${{ github.run_number }}
          body: |
            Download the APK below on your phone and open it to install.
            Built from ${{ github.sha }}.
          files: memdroid-*.apk
          make_latest: true
